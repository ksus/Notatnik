<!doctype html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>MindNotes — notatnik</title>
  <meta name="description" content="Notatnik w formie drzewa (mapa myśli). Działa offline, zapis lokalny, eksport i import .md.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f4">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MindNotes">

  <!-- Ustaw motyw i rozmiar czcionki zanim strona się narysuje (bez mignięcia) -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('drzewko.settings.v1') || '{}');
      var t = s.theme || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      if (s.fontSize) document.documentElement.style.setProperty('--fs', s.fontSize + 'px');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <h1>
        <svg class="logo" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <g stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M6 9h3"/><path d="M10 16h3M16 16h3"/><path d="M14 23h3M20 23h3M26 23h0"/>
          </g>
        </svg>
        MindNotes
      </h1>
      <div class="actions">
        <button id="btnArchive" class="icon-btn" type="button" aria-label="Archiwum"></button>
        <button id="btnSearch" class="icon-btn" type="button" aria-label="Szukaj i filtruj po tagach"></button>
        <button id="btnSettings" class="icon-btn" type="button" aria-label="Ustawienia"></button>
      </div>
    </header>

    <section id="archbar" hidden></section>

    <section id="filterbar" hidden>
      <input id="fInput" type="search" placeholder="Szukaj w notatkach…" autocomplete="off" enterkeyhint="search">
      <div id="fTags" class="chips"></div>
    </section>

    <main id="main">
      <div id="tree" role="tree" aria-label="Drzewo notatek"></div>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden></div>

    <footer id="composer">
      <div id="cCtx" class="ctx" hidden>
        <span id="cCtxLabel" class="ctx-label"></span>
        <b id="cCtxText"></b>
        <span class="lvl" title="Poziom nowego wpisu"><span id="cPrefix" class="lvl-n">-</span></span>
        <button id="cOut" class="sq sm" type="button" title="Poziom wyżej (Shift+Tab)" aria-label="Poziom wyżej"></button>
        <button id="cIn" class="sq sm" type="button" title="Poziom niżej (Tab)" aria-label="Poziom niżej"></button>
        <button id="cReset" class="mini" type="button" aria-label="Wróć do najwyższego poziomu" hidden></button>
      </div>
      <div class="inputrow">
        <textarea id="cInput" rows="1" placeholder="Nowa notatka… (#tag)" autocomplete="off"
               autocapitalize="sentences" enterkeyhint="send" maxlength="500"></textarea>
        <button id="cAdd" class="sq primary round" type="button" title="Dodaj (Enter)" aria-label="Dodaj notatkę"></button>
      </div>
    </footer>
  </div>

  <dialog id="sheet" class="sheet" aria-label="Notatka"></dialog>
  <dialog id="settings" class="sheet" aria-label="Ustawienia"></dialog>
  <dialog id="confirm" class="sheet" aria-label="Potwierdzenie"></dialog>
  <input id="fileIn" type="file" hidden>

  <noscript><p style="padding:1rem">Ta aplikacja wymaga włączonego JavaScriptu.</p></noscript>
  <script src="app.js" defer></script>
</body>
</html>
