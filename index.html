<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Notatki</title>
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --card:#fff; --line:#e2e8f0; --acc:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --card:#1e293b; --line:#334155; --acc:#60a5fa; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .view { display:none; flex-direction:column; height:100%; }
  .view.active { display:flex; }
  header { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; flex:1; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg);
    padding:8px 12px; border-radius:10px; cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { color:#dc2626; }
  #search { margin:12px 16px 0; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--fg); font:inherit; }
  #list { flex:1; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; }
  .note b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note small { color:var(--muted); }
  .note p { margin:4px 0 0; color:var(--muted); overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .empty { color:var(--muted); text-align:center; margin-top:48px; }
  #editor { flex:1; width:100%; border:0; outline:0; resize:none; padding:16px;
    background:var(--bg); color:var(--fg); font:16px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bar { display:flex; gap:8px; padding:8px 16px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .bar .spacer { flex:1; }
  #status { color:var(--muted); font-size:13px; align-self:center; }
</style>
</head>
<body>

<section id="listView" class="view active">
  <header>
    <h1>Notatki</h1>
    <button id="importBtn">Importuj</button>
    <button id="exportAllBtn">Eksport</button>
    <button id="newBtn" class="primary">+ Nowa</button>
  </header>
  <input id="search" type="search" placeholder="Szukaj...">
  <div id="list"></div>
</section>

<section id="editView" class="view">
  <header>
    <button id="backBtn">&larr;</button>
    <h1 id="editTitle">Notatka</h1>
    <span id="status"></span>
  </header>
  <textarea id="editor" placeholder="Pisz tutaj (Markdown). Pierwsza linia to tytuł."></textarea>
  <div class="bar">
    <button id="saveMdBtn">Pobierz .md</button>
    <button id="shareBtn">Udostępnij</button>
    <span class="spacer"></span>
    <button id="deleteBtn" class="danger">Usuń</button>
  </div>
</section>

<input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden>

<script>
const KEY = 'notes.v1';
let notes = load();
let currentId = null;
let saveTimer = null;

const $ = id => document.getElementById(id);

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); return true; }
  catch { $('status').textContent = 'Błąd zapisu!'; return false; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function titleOf(text) {
  const first = (text.split('\n').find(l => l.trim()) || '').replace(/^#+\s*/, '').trim();
  return first || 'Bez tytułu';
}
function fileName(n) {
  return titleOf(n.text).replace(/[\\/:*?"<>|]+/g, '').slice(0, 60).trim() + '.md';
}
function fmt(ts) {
  return new Date(ts).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
}

function show(view) {
  $('listView').classList.toggle('active', view === 'list');
  $('editView').classList.toggle('active', view === 'edit');
}

function renderList() {
  const q = $('search').value.trim().toLowerCase();
  const items = notes
    .filter(n => !q || n.text.toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);
  const box = $('list');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + (q ? 'Brak wyników.' : 'Brak notatek. Dodaj pierwszą.') + '</div>';
    return;
  }
  for (const n of items) {
    const el = document.createElement('div');
    el.className = 'note';
    const body = n.text.split('\n').filter(l => l.trim()).slice(1).join(' ');
    const b = document.createElement('b'); b.textContent = titleOf(n.text);
    const s = document.createElement('small'); s.textContent = fmt(n.updated);
    const p = document.createElement('p'); p.textContent = body;
    el.append(b, s, p);
    el.onclick = () => openNote(n.id);
    box.appendChild(el);
  }
}

function openNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  currentId = id;
  $('editor').value = n.text;
  $('editTitle').textContent = titleOf(n.text);
  $('status').textContent = '';
  show('edit');
  if (!n.text) $('editor').focus();
}

function newNote(text = '') {
  const n = { id: uid(), text, updated: Date.now() };
  notes.push(n);
  persist();
  return n;
}

function flush() {
  clearTimeout(saveTimer);
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  const text = $('editor').value;
  if (text === n.text) return;
  n.text = text;
  n.updated = Date.now();
  if (persist()) $('status').textContent = 'Zapisano';
}

$('editor').addEventListener('input', () => {
  $('status').textContent = '...';
  $('editTitle').textContent = titleOf($('editor').value);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
});

function back() {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (n && !n.text.trim()) notes = notes.filter(x => x.id !== currentId), persist();
  currentId = null;
  renderList();
  show('list');
}

function download(name, text) {
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('newBtn').onclick = () => openNote(newNote().id);
$('backBtn').onclick = back;
$('search').oninput = renderList;
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

$('deleteBtn').onclick = () => {
  if (!confirm('Usunąć tę notatkę?')) return;
  notes = notes.filter(x => x.id !== currentId);
  persist();
  currentId = null;
  renderList();
  show('list');
};

$('saveMdBtn').onclick = () => {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (n) download(fileName(n), n.text);
};

$('shareBtn').onclick = async () => {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  const file = new File([n.text], fileName(n), { type: 'text/markdown' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: titleOf(n.text) });
    } else if (navigator.share) {
      await navigator.share({ title: titleOf(n.text), text: n.text });
    } else {
      download(file.name, n.text);
    }
  } catch (e) { /* anulowano */ }
};

$('exportAllBtn').onclick = () => {
  if (!notes.length) return alert('Brak notatek do eksportu.');
  const all = [...notes].sort((a, b) => b.updated - a.updated)
    .map(n => n.text.trim()).join('\n\n---\n\n');
  download('notatki.md', all);
};

$('importBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  for (const f of e.target.files) newNote(await f.text());
  e.target.value = '';
  renderList();
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
renderList();
</script>
</body>
</html>
