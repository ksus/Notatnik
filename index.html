<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Notatki z Biblii</title>
<style>
  :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --card:#fff; --line:#e2e8f0; --acc:#2563eb; --chip:#e0e7ff; --chipfg:#3730a3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --card:#1e293b; --line:#334155; --acc:#60a5fa; --chip:#312e81; --chipfg:#c7d2fe; }
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  .view { display:none; flex-direction:column; height:100%; }
  .view.active { display:flex; }
  header { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg);
    padding:8px 12px; border-radius:10px; cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { color:#dc2626; }
  input[type=text], input[type=search] { width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; background:var(--card); color:var(--fg); font:inherit; }
  #menu { display:none; flex-wrap:wrap; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  #menu.open { display:flex; }
  #search { margin:12px 16px 0; width:calc(100% - 32px); }
  #tagBar { display:flex; gap:6px; overflow-x:auto; padding:10px 16px 0; }
  .chip { flex:none; background:var(--chip); color:var(--chipfg); border:0; border-radius:999px;
    padding:4px 12px; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--acc); color:#fff; }
  #list { flex:1; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
  .note { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; cursor:pointer; }
  .note b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .note small { color:var(--muted); }
  .note .tg { color:var(--acc); font-size:14px; margin-top:2px; }
  .note p { margin:4px 0 0; color:var(--muted); overflow:hidden; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .empty { color:var(--muted); text-align:center; margin-top:48px; }
  .fields { display:flex; flex-direction:column; gap:8px; padding:12px 16px 0; }
  #suggest { display:flex; gap:6px; flex-wrap:wrap; padding:8px 16px 0; }
  #editor { flex:1; width:100%; border:0; outline:0; resize:none; padding:16px;
    background:var(--bg); color:var(--fg); font:17px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .bar { display:flex; gap:8px; padding:8px 16px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .bar .spacer { flex:1; }
  #status { color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff;
    padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s; }
  #toast.show { opacity:.95; }
</style>
</head>
<body>

<section id="listView" class="view active">
  <header>
    <h1>Notatki z Biblii</h1>
    <button id="menuBtn">Menu</button>
    <button id="newBtn" class="primary">+ Nowa</button>
  </header>
  <div id="menu">
    <button id="mmDownloadBtn">Markmap: pobierz .md</button>
    <button id="mmCopyBtn">Markmap: kopiuj</button>
    <button id="backupBtn">Kopia zapasowa (.json)</button>
    <button id="importBtn">Importuj pliki</button>
  </div>
  <input id="search" type="search" placeholder="Szukaj we fragmentach, tagach i tekście...">
  <div id="tagBar"></div>
  <div id="list"></div>
</section>

<section id="editView" class="view">
  <header>
    <button id="backBtn">&larr;</button>
    <h1 id="editTitle">Notatka</h1>
    <span id="status"></span>
  </header>
  <div class="fields">
    <input id="refInput" type="text" placeholder="Fragment, np. J 3,16-21" enterkeyhint="next" autocomplete="off">
    <input id="tagsInput" type="text" placeholder="Tagi, oddzielone przecinkami" enterkeyhint="next" autocomplete="off">
  </div>
  <div id="suggest"></div>
  <textarea id="editor" placeholder="Notatki (Markdown): myśli, wnioski, zastosowanie..."></textarea>
  <div class="bar">
    <button id="saveMdBtn">Pobierz .md</button>
    <button id="shareBtn">Udostępnij</button>
    <span class="spacer"></span>
    <button id="deleteBtn" class="danger">Usuń</button>
  </div>
</section>

<input id="fileInput" type="file" accept=".md,.markdown,.txt,.json,text/markdown,text/plain,application/json" multiple hidden>
<div id="toast"></div>

<script>
const KEY = 'notes.v1';
const $ = id => document.getElementById(id);
let notes = load();
let currentId = null;
let saveTimer = null;
let activeTag = null; // klucz tagu (małe litery)

/* ---------- dane ---------- */
function load() {
  let arr;
  try { arr = JSON.parse(localStorage.getItem(KEY)) || []; } catch { arr = []; }
  return arr.map(n => {
    if ('ref' in n) { n.tags = n.tags || []; return n; }
    // migracja starego formatu (sam tekst): pierwsza linia -> fragment
    const lines = (n.text || '').split('\n');
    const i = lines.findIndex(l => l.trim());
    const ref = i >= 0 ? lines[i].replace(/^#+\s*/, '').trim() : '';
    const text = i >= 0 ? lines.slice(i + 1).join('\n').replace(/^\n+/, '') : '';
    return { id: n.id, ref, tags: [], text, updated: n.updated || Date.now() };
  });
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(notes)); return true; }
  catch { $('status').textContent = 'Błąd zapisu!'; return false; }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function parseTags(s) {
  const seen = new Set(), out = [];
  for (let t of s.split(',')) {
    t = t.trim().replace(/^#+/, '').trim();
    if (!t) continue;
    const k = t.toLowerCase();
    if (seen.has(k)) continue;
    seen.add(k); out.push(t);
  }
  return out;
}
function titleOf(n) { return (n.ref || '').trim() || 'Bez tytułu'; }
function fileName(n) {
  return titleOf(n).replace(/[\\/:*?"<>|]+/g, '').slice(0, 60).trim() + '.md';
}
function fmt(ts) {
  return new Date(ts).toLocaleString('pl-PL', { dateStyle: 'short', timeStyle: 'short' });
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function allTags() {
  const map = new Map();
  for (const n of notes) for (const t of n.tags) {
    const k = t.toLowerCase();
    const e = map.get(k) || { key: k, name: t, count: 0 };
    e.count++; map.set(k, e);
  }
  return [...map.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'pl'));
}

/* ---------- widoki ---------- */
function show(view) {
  $('listView').classList.toggle('active', view === 'list');
  $('editView').classList.toggle('active', view === 'edit');
}

function renderTagBar() {
  const bar = $('tagBar');
  bar.innerHTML = '';
  for (const t of allTags()) {
    const c = document.createElement('button');
    c.className = 'chip' + (activeTag === t.key ? ' on' : '');
    c.textContent = t.name + ' (' + t.count + ')';
    c.onclick = () => { activeTag = activeTag === t.key ? null : t.key; renderList(); };
    bar.appendChild(c);
  }
}

function renderList() {
  if (activeTag && !allTags().some(t => t.key === activeTag)) activeTag = null;
  renderTagBar();
  const q = $('search').value.trim().toLowerCase();
  const items = notes
    .filter(n => !activeTag || n.tags.some(t => t.toLowerCase() === activeTag))
    .filter(n => !q || (n.ref + ' ' + n.tags.join(' ') + ' ' + n.text).toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);
  const box = $('list');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<div class="empty">' + (q || activeTag ? 'Brak wyników.' : 'Brak notatek. Dodaj pierwszą.') + '</div>';
    return;
  }
  for (const n of items) {
    const el = document.createElement('div');
    el.className = 'note';
    const b = document.createElement('b'); b.textContent = titleOf(n);
    const s = document.createElement('small'); s.textContent = fmt(n.updated);
    el.append(b, s);
    if (n.tags.length) {
      const tg = document.createElement('div'); tg.className = 'tg';
      tg.textContent = n.tags.map(t => '#' + t.replace(/\s+/g, '_')).join(' ');
      el.append(tg);
    }
    const body = n.text.split('\n').filter(l => l.trim()).join(' ');
    if (body) { const p = document.createElement('p'); p.textContent = body; el.append(p); }
    el.onclick = () => openNote(n.id);
    box.appendChild(el);
  }
}

function renderSuggest() {
  const box = $('suggest');
  box.innerHTML = '';
  const have = new Set(parseTags($('tagsInput').value).map(t => t.toLowerCase()));
  for (const t of allTags().filter(t => !have.has(t.key)).slice(0, 12)) {
    const c = document.createElement('button');
    c.className = 'chip';
    c.textContent = '+ ' + t.name;
    c.onclick = () => {
      const cur = $('tagsInput').value.trim().replace(/,\s*$/, '');
      $('tagsInput').value = cur ? cur + ', ' + t.name : t.name;
      onEdit();
    };
    box.appendChild(c);
  }
}

/* ---------- edycja ---------- */
function openNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  currentId = id;
  $('refInput').value = n.ref;
  $('tagsInput').value = n.tags.join(', ');
  $('editor').value = n.text;
  $('editTitle').textContent = titleOf(n);
  $('status').textContent = '';
  renderSuggest();
  show('edit');
  if (!n.ref && !n.text) $('refInput').focus();
}

function newNote(data = {}) {
  const n = { id: uid(), ref: '', tags: [], text: '', updated: Date.now(), ...data };
  notes.push(n);
  persist();
  return n;
}

function flush() {
  clearTimeout(saveTimer);
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  const ref = $('refInput').value.trim();
  const tags = parseTags($('tagsInput').value);
  const text = $('editor').value;
  if (ref === n.ref && text === n.text && tags.join('\u0001') === n.tags.join('\u0001')) return;
  n.ref = ref; n.tags = tags; n.text = text;
  n.updated = Date.now();
  if (persist()) $('status').textContent = 'Zapisano';
}

function onEdit() {
  $('status').textContent = '...';
  $('editTitle').textContent = $('refInput').value.trim() || 'Bez tytułu';
  renderSuggest();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}
['refInput', 'tagsInput', 'editor'].forEach(id => $(id).addEventListener('input', onEdit));

function back() {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (n && !n.ref && !n.text.trim() && !n.tags.length) { notes = notes.filter(x => x.id !== currentId); persist(); }
  currentId = null;
  renderList();
  show('list');
}

/* ---------- formaty plików ---------- */
function noteToMd(n) {
  let s = '---\ntitle: ' + JSON.stringify(n.ref || '') + '\n';
  if (n.tags.length) s += 'tags: ' + JSON.stringify(n.tags) + '\n';
  s += '---\n\n# ' + titleOf(n) + '\n';
  if (n.text.trim()) s += '\n' + n.text.trim() + '\n';
  return s;
}

// Markmap: # korzeń > ## tag > ### fragment > treść notatki
function demote(text, base) {
  // najwyższy nagłówek w treści ma trafić na poziom base+1 (bez przeskakiwania poziomów)
  const lines = text.split('\n');
  let min = 7;
  for (const l of lines) { const m = l.match(/^(#{1,6})\s/); if (m) min = Math.min(min, m[1].length); }
  if (min === 7) return text;
  const by = base + 1 - min;
  return lines.map(l => {
    const m = l.match(/^(#{1,6})(\s.*)$/);
    return m ? '#'.repeat(Math.max(1, Math.min(6, m[1].length + by))) + m[2] : l;
  }).join('\n');
}
function markmapAll() {
  const groups = new Map();
  const sorted = [...notes].sort((a, b) => a.updated - b.updated);
  for (const n of sorted) {
    const tags = n.tags.length ? n.tags : ['Bez tagów'];
    for (const t of tags) {
      const k = t.toLowerCase();
      if (!groups.has(k)) groups.set(k, { name: t, items: [] });
      groups.get(k).items.push(n);
    }
  }
  let out = '# Biblia – notatki\n\n';
  const list = [...groups.values()].sort((a, b) => a.name.localeCompare(b.name, 'pl'));
  for (const g of list) {
    out += '## ' + g.name + '\n\n';
    for (const n of g.items) {
      out += '### ' + titleOf(n) + '\n';
      const body = demote(n.text.trim(), 3);
      if (body) out += '\n' + body + '\n';
      out += '\n';
    }
  }
  return out.trimEnd() + '\n';
}

function parseFront(raw) {
  const m = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  if (!m) return { meta: {}, body: raw };
  const meta = {};
  for (const line of m[1].split(/\r?\n/)) {
    const kv = line.match(/^(\w+):\s*(.*)$/);
    if (kv) meta[kv[1]] = kv[2].trim();
  }
  return { meta, body: m[2] };
}
function unquote(v) {
  try { return JSON.parse(v); } catch { return v.replace(/^['"]|['"]$/g, ''); }
}
function importMd(raw, fname) {
  const { meta, body } = parseFront(raw);
  let ref = meta.title ? String(unquote(meta.title)) : '';
  let tags = [];
  if (meta.tags) {
    const v = unquote(meta.tags);
    tags = Array.isArray(v) ? v.map(String) : parseTags(String(v).replace(/^\[|\]$/g, ''));
  }
  let text = body.replace(/^\s+/, '');
  const h = text.match(/^#\s+(.*)\r?\n?/);
  if (h && (!ref || h[1].trim() === ref)) { ref = h[1].trim(); text = text.slice(h[0].length).replace(/^\s+/, ''); }
  if (!ref) ref = fname.replace(/\.(md|markdown|txt)$/i, '');
  return { ref, tags: parseTags(tags.join(',')), text: text.trimEnd() };
}

/* ---------- pliki i schowek ---------- */
function download(name, text, type = 'text/markdown') {
  const blob = new Blob([text], { type: type + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

/* ---------- zdarzenia ---------- */
$('newBtn').onclick = () => openNote(newNote().id);
$('backBtn').onclick = back;
$('search').oninput = renderList;
$('menuBtn').onclick = () => $('menu').classList.toggle('open');
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });

$('deleteBtn').onclick = () => {
  if (!confirm('Usunąć tę notatkę?')) return;
  notes = notes.filter(x => x.id !== currentId);
  persist();
  currentId = null;
  renderList();
  show('list');
};

$('saveMdBtn').onclick = () => {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (n) download(fileName(n), noteToMd(n));
};

$('shareBtn').onclick = async () => {
  flush();
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  const md = noteToMd(n);
  const file = new File([md], fileName(n), { type: 'text/markdown' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: titleOf(n) });
    } else if (navigator.share) {
      await navigator.share({ title: titleOf(n), text: md });
    } else {
      download(file.name, md);
    }
  } catch (e) { /* anulowano */ }
};

$('mmDownloadBtn').onclick = () => {
  if (!notes.length) return toast('Brak notatek');
  download('biblia-markmap.md', markmapAll());
};
$('mmCopyBtn').onclick = async () => {
  if (!notes.length) return toast('Brak notatek');
  toast(await copyText(markmapAll()) ? 'Skopiowano do schowka' : 'Nie udało się skopiować');
};
$('backupBtn').onclick = () => {
  if (!notes.length) return toast('Brak notatek');
  download('notatki-kopia.json', JSON.stringify(notes, null, 2), 'application/json');
};

$('importBtn').onclick = () => $('fileInput').click();
$('fileInput').onchange = async e => {
  let added = 0;
  for (const f of e.target.files) {
    const raw = await f.text();
    if (/\.json$/i.test(f.name)) {
      try {
        const arr = JSON.parse(raw);
        for (const n of Array.isArray(arr) ? arr : []) {
          if (!n || typeof n !== 'object' || notes.some(x => x.id === n.id)) continue;
          notes.push({ id: n.id || uid(), ref: String(n.ref || ''), tags: parseTags((n.tags || []).join(',')),
            text: String(n.text || ''), updated: n.updated || Date.now() });
          added++;
        }
        persist();
      } catch { toast('Błędny plik .json'); }
    } else {
      newNote(importMd(raw, f.name)); added++;
    }
  }
  e.target.value = '';
  renderList();
  if (added) toast('Zaimportowano: ' + added);
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (notes.length) persist();
renderList();
</script>
</body>
</html>
